name: tax-alert

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 09:00 KST 매일
  workflow_dispatch:       # 수동 실행용

permissions:
  contents: write          # state 커밋용

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # 개인 이메일은 repo에 커밋하지 않고 Secrets에서 주입
      - name: Generate config
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: sed "s/user@example.com/$ALERT_EMAIL/g" config.example.yaml > config.yaml

      - name: Run agent
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m tax_agent.cli run

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update filing state"
            git push
          fi

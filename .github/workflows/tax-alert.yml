name: tax-alert

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 09:00 KST 매일
  workflow_dispatch:       # 수동 실행용
    inputs:
      test_today:
        description: '테스트용 날짜 YYYY-MM-DD (예: 2026-05-01 → 신고시작 메일 발송). state 저장 안 함'
        required: false

permissions:
  contents: write          # state 커밋용

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # 개인 이메일은 repo에 커밋하지 않고 Secrets에서 주입.
      # ALERT_EMAIL: 수신자 (쉼표로 여러 명 가능)
      # GMAIL_SENDER: 발신 Gmail (생략 시 ALERT_EMAIL의 첫 번째 주소 사용)
      - name: Generate config
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL || secrets.ALERT_EMAIL }}
          GMAIL_SENDER: ${{ vars.GMAIL_SENDER || secrets.GMAIL_SENDER }}
        run: |
          SENDER="${GMAIL_SENDER:-${ALERT_EMAIL%%,*}}"
          sed -e "s/user@example.com/$ALERT_EMAIL/" \
              -e "s/sender@example.com/$SENDER/" \
              config.example.yaml > config.yaml

      - name: Run agent
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_TODAY: ${{ inputs.test_today }}
        run: |
          if [ -n "$TEST_TODAY" ]; then
            # 테스트: 지정 날짜로 실발송, state는 임시 디렉토리 (커밋 안 됨)
            python -m tax_agent.cli --state-dir /tmp/test-state run --today "$TEST_TODAY"
          else
            python -m tax_agent.cli run
          fi

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update filing state"
            git push
          fi
